<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมัครสมาชิก - ระบบยืม-คืนอุปกรณ์กีฬา</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .register-wrap{
    max-width:560px;
    margin:48px auto;
    padding:0 20px;
  }
  .register-panel{
    background:#fff;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    padding:28px 30px;
  }
  .register-title{
    margin:0 0 6px;
    font-size:19px;
    font-weight:600;
    color:var(--text-dark);
  }
  .register-sub{
    margin:0 0 22px;
    font-size:13px;
    color:#888;
  }
  .register-row{
    display:grid;
    grid-template-columns:110px 1fr;
    gap:12px;
  }
  .register-error{
    display:none;
    background:#fde3e3;
    color:#d4453a;
    border:1px solid #f5c2c2;
    border-radius:6px;
    padding:10px 14px;
    font-size:13px;
    margin-bottom:16px;
  }
  .register-error.show{display:block;}
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="https://img.sanishtech.com/u/f8d7c7ad4e9162b6c4f5a6b2e7f38aab.png" alt="logo" class="logo-img">
      <div class="brand-text">
        <p class="th">การยืม-คืนอุปกรณ์กีฬาของกลุ่มสาระการเรียนรู้สุขศึกษาและพลศึกษา</p>
        <p class="en">Sports Equipment Borrowing and Return Management System</p>
      </div>
    </div>
  </header>

  <main class="register-wrap">
    <section class="register-panel">
      <h2 class="register-title">สมัครสมาชิกเพื่อเริ่มใช้งาน</h2>
      <p class="register-sub">กรอกข้อมูลของคุณครั้งเดียว ระบบจะจำไว้ในเบราว์เซอร์นี้ให้อัตโนมัติในการใช้งานครั้งต่อไป</p>

      <div id="registerError" class="register-error"></div>

      <form id="registerForm">
        <div class="register-row form-group">
          <div>
            <label for="reg-prefix">คำนำหน้า</label>
            <select id="reg-prefix">
              <option value="นาย">นาย</option>
              <option value="นาง">นาง</option>
              <option value="นางสาว">นางสาว</option>
            </select>
          </div>
          <div>
            <label for="reg-firstname">ชื่อ</label>
            <input type="text" id="reg-firstname" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-lastname">นามสกุล</label>
          <input type="text" id="reg-lastname" required>
        </div>

        <div class="register-row form-group">
          <div>
            <label for="reg-studentid">รหัสนักเรียน</label>
            <input type="text" id="reg-studentid" required>
          </div>
          <div>
            <label for="reg-class">ชั้นเรียน</label>
            <input type="text" id="reg-class" placeholder="เช่น ม.5/3" required>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">อีเมล</label>
          <input type="email" id="reg-email" required>
        </div>

        <div class="form-group">
          <label for="reg-phone">เบอร์โทรศัพท์</label>
          <input type="text" id="reg-phone" required>
        </div>

        <button type="submit" class="btn-save" style="width:100%; margin-top:6px;">สมัครสมาชิก</button>
      </form>
    </section>
  </main>

  <script src="sheetdb-api.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const errorBox = document.getElementById('registerError');

    // ถ้าเบราว์เซอร์นี้เคยสมัครไว้แล้ว ให้ข้ามไปหน้าหลักเลย ไม่ต้องสมัครซ้ำ
    if (localStorage.getItem('currentMemberId')) {
      window.location.href = 'index.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'กำลังสมัคร...';

      try {
        const id = generateMemberId();
        await registerMember({
          รหัสสมาชิก: id,
          คำนำหน้า: document.getElementById('reg-prefix').value,
          ชื่อ: document.getElementById('reg-firstname').value.trim(),
          นามสกุล: document.getElementById('reg-lastname').value.trim(),
          รหัสนักเรียน: document.getElementById('reg-studentid').value.trim(),
          ชั้นเรียน: document.getElementById('reg-class').value.trim(),
          อีเมล: document.getElementById('reg-email').value.trim(),
          เบอร์โทรศัพท์: document.getElementById('reg-phone').value.trim(),
          ตำแหน่ง: 'นักเรียน',
          วันที่สมัครสมาชิก: new Date().toISOString().slice(0, 10),
          สถานะบัญชี: 'ใช้งาน',
        });

        localStorage.setItem('currentMemberId', id);
        window.location.href = 'index.html';
      } catch (err) {
        errorBox.textContent = 'สมัครสมาชิกไม่สำเร็จ: ' + err.message;
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'สมัครสมาชิก';
      }
    });
  </script>
</body>
</html>
